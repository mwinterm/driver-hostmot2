# A Mesa 7I76EU at its factory address, cabled straight to the host's port:
# five stepgens, the on-board 7I76 on Smart Serial port 0, one encoder. The
# bench of LeafCNC's docs/mesa-bringup.md, first run on a Raspberry Pi 4.
#
#   hm2-host examples/7i76eu-bench.conf build
#
# The control's side is LeafCNC's config/examples/mill3-7i76eu/, which names
# the same region. What a pin means -- which stepgen is X, which input is its
# switch -- is said there and not here (ADR 0022 §5).
#
# The host's port wants the card's subnet and nothing else on the link:
#
#   nmcli con add type ethernet ifname eth0 con-name mesa \
#       ipv4.method manual ipv4.addresses 192.168.1.1/24 ipv6.method disabled

region = /cnc-hm2-0
axes = 3
cycle_us = 1000

# The worst cycle is measured at every start; see 7i92-7i77.conf.

# The core's silence is counted only from its first answer, so the control
# may be started by hand after this, as late as it likes; the default 100
# cycles then bound how long a core that stops answering leaves its last
# setpoints on the card.

# The card answers to 192.168.1.121 with both address jumpers in their
# factory position. `num_stepgens=5` is every stepgen the stock firmware has;
# `sserial_port_0=0xxxxx` puts the 7I76 on channel 0 in mode 0 (io_spin) and
# leaves the rest of the port disabled.
module.board_ip = 192.168.1.121
module.config = num_encoders=1 num_stepgens=5 sserial_port_0=0xxxxx

# The stepgens count in steps: position-scale 1, so the steps per metre live
# in the control's _scale keys, in one place. maxvel and maxaccel, in steps,
# sit above the axis limits the control plans inside (0.2 m/s and 2 m/s^2 at
# 320 000 steps per metre), so the stepgen never clamps what was planned.
# Step timing for the DM542 class: 5 us pulses, 10 us direction setup and
# hold, which caps the card at 100 kHz.
param.hm2_7i76e.0.stepgen.00.position-scale = 1.0
param.hm2_7i76e.0.stepgen.01.position-scale = 1.0
param.hm2_7i76e.0.stepgen.02.position-scale = 1.0
param.hm2_7i76e.0.stepgen.00.maxvel = 80000
param.hm2_7i76e.0.stepgen.01.maxvel = 80000
param.hm2_7i76e.0.stepgen.02.maxvel = 80000
param.hm2_7i76e.0.stepgen.00.maxaccel = 1000000
param.hm2_7i76e.0.stepgen.01.maxaccel = 1000000
param.hm2_7i76e.0.stepgen.02.maxaccel = 1000000
param.hm2_7i76e.0.stepgen.00.steplen = 5000
param.hm2_7i76e.0.stepgen.01.steplen = 5000
param.hm2_7i76e.0.stepgen.02.steplen = 5000
param.hm2_7i76e.0.stepgen.00.stepspace = 5000
param.hm2_7i76e.0.stepgen.01.stepspace = 5000
param.hm2_7i76e.0.stepgen.02.stepspace = 5000
param.hm2_7i76e.0.stepgen.00.dirsetup = 10000
param.hm2_7i76e.0.stepgen.01.dirsetup = 10000
param.hm2_7i76e.0.stepgen.02.dirsetup = 10000
param.hm2_7i76e.0.stepgen.00.dirhold = 10000
param.hm2_7i76e.0.stepgen.01.dirhold = 10000
param.hm2_7i76e.0.stepgen.02.dirhold = 10000

# Above the control's servo thread at 90: this process is the timebase. On a
# Pi with one isolated core, that core is the control's and this goes on a
# housekeeping core beside it.
rt_priority = 92
cpu_affinity = 2
