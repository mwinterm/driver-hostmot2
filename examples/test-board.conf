# The board that is not there: upstream's own fake, which shows the generic
# HostMot2 driver a test pattern instead of an IDROM read off a card.
#
#   hm2-host examples/test-board.conf build
#
# It exists so the whole path -- module load, IDROM parse, pin declaration,
# the shared region, the cycle -- can be run on a machine with no Mesa
# hardware in it, which is every machine in CI (ADR 0022 §1). What it does not
# exercise is the only thing that matters in the end: a real card answering a
# real packet in a real millisecond.

transport = hm2_test
region = /cnc-hm2-test
axes = 3
cycle_us = 1000

# Test pattern 2 is the one that presents a plausible board.
module.test_pattern = 12

# The default -- a hundred unanswered cycles, a tenth of a second -- is right
# for a machine, where the control answers from its first cycle. Raise it to
# 30000 to start a control by hand afterwards, or this gives up before you
# have typed the command.
