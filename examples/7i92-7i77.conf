# A 7i92 with a 7i77 on P1 and a 7i74 on P2 -- the machine ADR 0022's Context
# describes, and the first target.
#
#   hm2-host examples/7i92-7i77.conf build
#
# What this file says is what the *hardware* is. What any of it means to a
# machine -- which pin is an axis's feedback, what its limits are, which way is
# X -- is the control's machine description, on the other side of the channel
# (ADR 0022 §5). Two files that both described the machine would be two files
# to disagree.

# The shared region the control attaches to. The control's `drivers:` stanza
# names the same string.
region = /cnc-mesa-0

# Axes the channel carries. The fixed axis arrays go unused on this machine --
# every axis is a named signal, because a HostMot2 card has no notion of one --
# but the header still has to say how many the machine has.
axes = 3

# One LBP16 round trip over UDP per cycle. ADR 0022 §7 calls this a 1 ms-class
# interface and means it: the round trip is the floor, not the software.
cycle_us = 1000

# What this process tells the control its worst cycle costs, in the channel
# header. The control refuses a machine whose cycle this does not fit (§10.2),
# which is the check that used to stop at the process boundary. Measure it on
# the bench and put the measurement here; 800 us is a placeholder that leaves
# 200 us of a 1 ms cycle and is almost certainly pessimistic.
worst_case_cycle_ns = 800000

# The board. `board_ip` and `config` are the module parameters a LinuxCNC
# `loadrt hm2_eth` line would set, and they mean exactly what they mean there.
module.board_ip = 10.10.10.10
module.config = num_encoders=6 num_pwmgens=0 num_stepgens=0 sserial_port_0=00xxxx

# HAL parameters: what a `setp` line would set. An encoder scale is counts per
# millimetre of travel, and this machine's Heidenhain scales are 0.5 um.
param.hm2_7i92.0.encoder.00.scale = 2000
param.hm2_7i92.0.encoder.01.scale = 2000
param.hm2_7i92.0.encoder.02.scale = 2000

# Above the control's servo thread, which runs at 90: this process is the
# timebase, and being preempted by the thread it releases makes the cycle late
# by definition (ADR 0011).
rt_priority = 92
