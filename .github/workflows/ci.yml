# driver-hostmot2's own CI (ADR 0022).
#
# There is no Mesa card on a GitHub runner, so what this can prove is
# everything up to the wire: that LinuxCNC's driver still builds unmodified
# against the shim, that the shim satisfies its whole link surface, and that
# `hm2-host` runs it end to end against upstream's own fake board -- module
# load, IDROM parse, pin declaration, the shared region, the cycle.
#
# What it cannot prove is the only thing that matters in the end: a real card
# answering a real packet in a real millisecond. That is the Mesa bench's job,
# and until it exists every row of the support matrix says `untested`.

name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: build and run against the fake board
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The whole point of the shim. If this breaks, either upstream changed
      # the HAL surface -- which a sync would have brought in -- or the shim
      # stopped covering it.
      - name: the driver builds unmodified against the shim
        run: make -j"$(nproc)"

      # What no fake board shows: the fake boards have no Smart Serial port.
      # Each rise of a port's fault count is one fault, counted and logged;
      # the driver's decay of it is none.
      - name: every Smart Serial fault is counted
        run: make check

      - name: nothing is left undefined
        run: |
          for so in build/libhostmot2.so build/libhm2_eth.so build/libhm2shim.so \
                    build/libhm2_test.so; do
            missing=$(LD_LIBRARY_PATH=build ldd -r "$so" 2>&1 | grep 'undefined symbol' || true)
            if [ -n "$missing" ]; then
              echo "$so has undefined symbols:" >&2
              echo "$missing" >&2
              exit 1
            fi
          done
          echo "every symbol resolves"

      # Upstream's own fake board, which is what lets the whole path run on a
      # machine with no Mesa hardware in it.
      - name: the host runs the driver against the fake board
        run: |
          timeout 10 ./build/hm2-host examples/test-board.conf build \
            > /tmp/host.log 2>&1 || true
          cat /tmp/host.log

          # The generic driver parsed the fake board's IDROM and enumerated it.
          grep -q 'hm2/hm2_test.0: registered' /tmp/host.log \
            || { echo "the driver never registered the board" >&2; exit 1; }

          # The shim collected its pins and its cyclic functions.
          grep -qE "component 'hm2_test' ready: [0-9]+ pin" /tmp/host.log \
            || { echo "the shim collected no pins" >&2; exit 1; }
          grep -q "exported function 'hm2_test.0.read'" /tmp/host.log \
            || { echo "no read function was exported" >&2; exit 1; }

          # And the host published them into a region and cycled it.
          grep -qE 'region /cnc-hm2-test: [0-9]+ signal' /tmp/host.log \
            || { echo "the region was never created" >&2; exit 1; }

          # By name, one line per signal. The machine description on the other
          # side names these pins as text, so a count cannot be checked against
          # it -- and the names depend on the board and on which sserial
          # devices answered, so they cannot be derived from a configuration
          # file either.
          grep -qE 'signal +[0-9]+ in +bool .*hm2_test\.0\.gpio\.000\.in$' /tmp/host.log \
            || { echo "the published signals were not logged by name" >&2; exit 1; }

          # The value index is dense *within a direction*, which is the
          # channel's rule and the one thing a reader of the table must not
          # infer from its order: the first output carries value index 0 while
          # sitting well down the table.
          grep -qE 'signal +[0-9]+ out .* value +0 +hm2_test\.0\.gpio\.000\.out$' /tmp/host.log \
            || { echo "the value index is not dense within its direction" >&2; exit 1; }

          # With no control attached it keeps cycling and does not let the
          # FPGA watchdog bite: until a control has answered, every output is
          # still the value this process seeded it with, so there is nothing a
          # silent control could leave on the machine. The response watchdog
          # counts from the control's first answer (ADR 0011 §5), which is
          # when a control that goes quiet leaves its last setpoints behind;
          # that path needs a control, and the control's own CI runs it.
          if grep -q 'letting the FPGA watchdog bite' /tmp/host.log; then
            echo "the response watchdog fired with no control ever attached" >&2
            exit 1
          fi

          # One period, read to write (channel 2.3.0, the control's ADR
          # 0046): on by default, and the process's own timing published
          # beside the driver's pins, in seconds.
          grep -q 'same cycle: each period reads, publishes, waits' /tmp/host.log \
            || { echo "the host did not take the same-cycle shape by default" >&2; exit 1; }
          for name in read-time answer-time answers-late sserial-faults; do
            grep -qE "signal +[0-9]+ in .* hm2-host\.$name$" /tmp/host.log \
              || { echo "hm2-host.$name was not published" >&2; exit 1; }
          done

      # A `pin.` line fixes a pin the driver only reads, and publishes it for
      # reading only (channel 2.2.0, the control's ADR 0045 §2). Everything
      # else a `pin.` line could name is refused by name, with its line.
      - name: a pin is fixed by its pin. line, and only a pin the driver reads
        run: |
          { cat examples/test-board.conf; echo 'pin.hm2_test.0.gpio.023.out = true'; } \
            > /tmp/fixed.conf
          timeout 5 ./build/hm2-host /tmp/fixed.conf build > /tmp/fixed.log 2>&1 || true
          grep -q 'pin hm2_test.0.gpio.023.out fixed at 1' /tmp/fixed.log \
            || { cat /tmp/fixed.log; echo "the pin was not fixed" >&2; exit 1; }
          grep -qE 'signal +[0-9]+ in +bool .* fixed +hm2_test\.0\.gpio\.023\.out$' /tmp/fixed.log \
            || { echo "a fixed pin was not published as an input marked fixed" >&2; exit 1; }

          { cat examples/test-board.conf
            echo 'pin.hm2_test.0.gpio.000.in = true'
            echo 'pin.hm2_test.0.gpio.099.out = 1'
            echo 'pin.hm2_test.0.gpio.001.out = 2'; } > /tmp/refused.conf
          if timeout 5 ./build/hm2-host /tmp/refused.conf build > /tmp/refused.log 2>&1; then
            echo "pin lines that cannot hold were accepted" >&2; exit 1
          fi
          grep -q 'pin.hm2_test.0.gpio.000.in is a pin the driver writes' /tmp/refused.log \
            || { echo "a pin the driver writes was not refused" >&2; exit 1; }
          grep -q 'pin.hm2_test.0.gpio.099.out is not a pin the driver declared' /tmp/refused.log \
            || { echo "an undeclared pin was not refused" >&2; exit 1; }
          grep -q 'does not fit the pin, which is a bit' /tmp/refused.log \
            || { echo "a value that does not fit was not refused" >&2; exit 1; }

      # The rule that makes the two-repository split mean anything, checked
      # from this side too (ADR 0022 §8).
      # One file crosses between the two repositories, in this direction, and
      # it is the channel's layout. Anything else would make this a build
      # dependency on the control rather than a program that speaks its
      # protocol -- and the separation the whole ADR rests on is that these
      # are two programs sharing a documented boundary.
      - name: only the channel header crosses
        run: |
          stray=$(grep -rhoE '#include *[<"]cnc_[a-z0-9_]+\.h[>"]' shim host \
                    | grep -v 'cnc_outboard.h' | sort -u || true)
          if [ -n "$stray" ]; then
            echo "shim/ or host/ includes a header of the control's other than" >&2
            echo "cnc_outboard.h:" >&2
            echo "$stray" >&2
            exit 1
          fi
          echo "cnc_outboard.h is the only one"

          # And it is vendored rather than reached for, with the version it
          # came from written down (ADR 0022 §8).
          test -f host/include/cnc_outboard.h \
            || { echo "the channel header is not vendored" >&2; exit 1; }
          grep -q 'Copied from commit' host/include/README.md \
            || { echo "host/include/README.md does not say which version" >&2; exit 1; }
